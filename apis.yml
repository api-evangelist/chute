name: Chute
description: >-
  Chute was a visual marketing automation platform (getchute.com) that helped
  brands discover, collect, rights-manage and publish consumer and
  user-generated visual content. Its product line spanned visual insights,
  digital asset management and content publishing, and it exposed a public REST
  API documented on Apiary (docs.chute.apiary.io) with first-party Ruby and
  Node.js client libraries. The company is defunct: the canonical domain no
  longer serves a site, the API and developer hosts do not resolve, the Apiary
  documentation returns 502, and the github.com/chute organization has been
  deleted. Only the abandoned package-registry entries survive. Retained in the
  API Evangelist network as a historical record of a former API provider.
