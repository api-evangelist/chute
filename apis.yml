x-enrichment-probe:
  date: '2026-07-20'
  finding: >-
    Re-probed and confirmed defunct. getchute.com is still delegated to AWS Route
    53 nameservers but publishes no A record, so neither the apex nor any
    api./developer./docs./www. subdomain resolves. The historical Apiary
    documentation host returns 502 and the github.com/chute organization is gone
    (the login was recycled by an unrelated user account created 2018-12-21, and
    chute-ruby / chute-node both 404). chuteapp.com resolves but is an Atom
    domain-for-sale listing, and the PyPI "chute" package is an unrelated
    discrete-event-simulation library. The only genuine surviving first-party
    artifacts are the abandoned RubyGems and npm client libraries, captured in
    packages/chute-packages.yml. No OpenAPI, well-known, MCP, webhook or
    security surface exists to search, derive or probe. Nothing was fabricated.
